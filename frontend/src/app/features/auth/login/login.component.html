<div class="auth-container">
  <div class="card auth-card">
    <div class="auth-header">
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to your account</p>
    </div>

    @if (errorMessage()) {
      <div class="alert alert--danger" role="alert" aria-live="polite">
        {{ errorMessage() }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email" class="form-label">Email address</label>
        <input
          id="email"
          type="email"
          autocomplete="email"
          formControlName="email"
          class="form-control"
          placeholder="you@example.com"
          [class.ng-invalid]="isFieldInvalid('email')"
        />
        @if (isFieldInvalid('email')) {
          <div class="form-error">Please enter a valid email address.</div>
        }
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          formControlName="password"
          class="form-control"
          placeholder="••••••••"
          [class.ng-invalid]="isFieldInvalid('password')"
        />
        @if (isFieldInvalid('password')) {
          <div class="form-error">Password is required.</div>
        }
        <div style="text-align: right; margin-top: 0.5rem;">
          <a routerLink="/forgot-password" class="auth-link" style="font-size: 0.875rem;">Forgot Password?</a>
        </div>
      </div>

      <button
        type="submit"
        class="btn btn--primary btn--block btn--lg auth-submit"
        [disabled]="isLoading()"
        [attr.aria-busy]="isLoading()"
      >
        @if (isLoading()) {
          <span class="spinner"></span> Logging in...
        } @else {
          Sign In
        }
      </button>
    </form>

    <div class="auth-divider" style="text-align: center; margin: 1.5rem 0; position: relative;">
      <span style="background: var(--surface-card); padding: 0 1rem; color: var(--text-muted); position: relative; z-index: 1;">or</span>
      <div style="position: absolute; top: 50%; left: 0; right: 0; border-top: 1px solid var(--border-color);"></div>
    </div>

    <button
      type="button"
      class="btn btn--block btn--lg"
      style="background-color: white; color: #757575; border: 1px solid #ddd; margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem;"
      (click)="loginWithGoogle()"
      [disabled]="isLoading()"
    >
      <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path></svg>
      Sign in with Google
    </button>

    <div class="auth-footer">
      <p class="auth-footer-text">
        Don't have an account?
        <a routerLink="/register" class="auth-link">Sign up</a>
      </p>
    </div>
  </div>
</div>
